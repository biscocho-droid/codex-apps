<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#111936" />
  <title>Skybound</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell">
    <div class="brand"><span>SKY</span>BOUND</div>
    <div class="canvas-wrap">
      <canvas id="game" width="480" height="720" aria-label="Skybound arcade game"></canvas>
      <button id="soundBtn" class="icon-btn" aria-label="Toggle sound">♪</button>
    </div>
    <p class="hint"><span>SPACE / TAP</span> to fly · <span>P</span> pause · <span>F</span> fullscreen</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
