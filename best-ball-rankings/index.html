<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f141b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="NFL Rankings">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>2026 NFL Rankings</title>
    <link rel="manifest" href="manifest.webmanifest?v=2026-06-14-full-rankings">
    <link rel="stylesheet" href="app/styles.css?v=2026-06-14-full-rankings">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="kicker">Fantasy Football</p>
          <h1>2026 NFL Rankings</h1>
          <p class="snapshot">QB + RB + WR + TE rankings snapshot: June 14, 2026</p>
        </div>
        <div class="count-card" aria-label="Player count">
          <span id="visibleCount">0</span>
          <small>players</small>
        </div>
      </header>

      <section class="controls" aria-label="Ranking controls">
        <label class="search">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="Player or team" autocomplete="off">
        </label>
        <div id="positionFilters" class="segmented" role="group" aria-label="Filter by position"></div>
      </section>

      <section class="summary-grid" aria-label="Position summary">
        <article>
          <span class="summary-label">Positions shown</span>
          <strong id="positionsShown">-</strong>
        </article>
        <article>
          <span class="summary-label">Top player shown</span>
          <strong id="topPlayer">-</strong>
        </article>
        <article>
          <span class="summary-label">Average rank shown</span>
          <strong id="avgRank">-</strong>
        </article>
      </section>

      <section class="toolbar" aria-label="Sort and view options">
        <span class="toolbar-label">Sort</span>
        <button class="sort-button active" type="button" data-sort="overall" title="Sort by overall rank" aria-label="Sort by overall rank">Overall</button>
        <button class="sort-button" type="button" data-sort="position" title="Sort by position rank" aria-label="Sort by position rank">Pos Rank</button>
      </section>

      <section id="rankings" class="rankings" aria-live="polite"></section>
      <p id="emptyState" class="empty" hidden>No players match that filter.</p>
    </main>

    <script src="data/rankings-data.js?v=2026-06-14-full-rankings"></script>
    <script src="app/app.js?v=2026-06-14-full-rankings"></script>
  </body>
</html>
